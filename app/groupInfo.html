<!DOCTYPE html>
<html>

<head>
    <title>Group Members</title>

    <style>
        :root {
            --bg: #f7ece8;
            --surface: #fffaf8;
            --surface-soft: #f3e0da;
            --text: #4f2d28;
            --muted: #7a4f45;
            --primary: #a44d3d;
            --primary-dark: #8c3f33;
            --accent: #f0d7d0;
            --border: #d3a79a;
            --shadow: 0 6px 16px rgba(110, 66, 58, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            padding: 24px;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }

        .header {
            background: linear-gradient(135deg, var(--accent), #e5b9b0);
            color: var(--text);
            padding: 24px 28px;
            margin-bottom: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            min-height: 90px;
            border: 1px solid var(--border);
        }

        .members-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        @media(max-width: 1500px) {
            .members-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media(max-width: 800px) {
            .members-container {
                grid-template-columns: 1fr;
            }
        }

        .student-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .student-card h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .student-card p {
            margin: 6px 0;
            color: var(--muted);
        }

        button {
            border: 1px solid var(--border);
            background: #f7efe4;
            color: var(--text);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #efe2d0;
        }

        #panel {
            margin-top: 20px;
            text-align: center;
        }
        #panel a, #panel a:visited {
            color: var(--text);
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Group Information</h1>
        <h3>Loading group</h3>
    </div>

    <div class="members-container">

    </div>

    <div id="panel">
        <a href="dashboard.html" class="back">
            ← Back to dashboard
        </a>
    </div>

    <script src="./js/groupInfo.js"></script>
</body>

</html>
