<!DOCTYPE html>
<html>

<head>
    <title>Group Members</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .header {
            border: 1px solid black;
            padding: 20px;
            margin-bottom: 20px;
        }

        .members-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .student-card {
            border: 1px solid black;
            padding: 20px;
        }

        button {
            border: 1px solid black;
            background: white;
            padding: 8px 15px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Group 1</h1>
        <p>Members List</p>
    </div>

    <div class="members-container">

        <div class="student-card">
            <h2>Ditchon</h2>
            <p>Average: 37/40</p>

            <button>
                View Rating
            </button>
        </div>

        <div class="student-card">
            <h2>Tanguamos Althea P.</h2>
            <p>Average: 35/40</p>

            <button>
                View Rating
            </button>
        </div>

        <div class="student-card">
            <h2>Apao</h2>
            <p>Average: 38/40</p>

            <button>
                View Rating
            </button>
        </div>

    </div>

</body>

</html>
