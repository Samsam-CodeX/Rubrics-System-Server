<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Group Evaluation</title>
    <style>
        :root {
            --bg: #f7ece8;
            --surface: #fffaf8;
            --surface-soft: #f3e0da;
            --text: #4f2d28;
            --muted: #7a4f45;
            --primary: #a44d3d;
            --primary-dark: #8c3f33;
            --accent: #f0d7d0;
            --border: #d3a79a;
            --shadow: 0 8px 20px rgba(110, 66, 58, 0.12);
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg) 0%, #fcf7f4 100%);
            color: var(--text);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 10px;
            color: var(--text);
        }

        .header p {
            color: var(--muted);
            margin: 5px 0;
        }

        .members-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .member-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .member-card h2 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .member-card p {
            margin: 8px 0;
            color: var(--muted);
        }

        .member-card button {
            width: 100%;
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 10px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .member-card button:hover {
            background: var(--primary-dark);
        }

        .member-card button.disabled {
            background: #9ca3af;
            cursor: default;
        }

        @media (max-width: 900px) {
            .members-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .members-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Group Evaluation</h1>
            <p id="group-info">Loading group members...</p>
        </div>

        <div class="members-container" id="members-container"></div>
    </div>

    <script src="./js/student_GroupInfo.js"></script>
</body>
</html>
