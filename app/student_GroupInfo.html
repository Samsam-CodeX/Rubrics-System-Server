<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Group Evaluation</title>
    <style>
        :root {
            --bg: #f7ece8;
            --surface: #fffaf8;
            --surface-soft: #f3e0da;
            --text: #4f2d28;
            --muted: #7a4f45;
            --primary: #a44d3d;
            --primary-dark: #8c3f33;
            --accent: #f0d7d0;
            --border: #d3a79a;
            --shadow: 0 8px 20px rgba(110, 66, 58, 0.12);
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            margin: 24px auto;
        }

        .header {
            background: linear-gradient(135deg, var(--accent), #e5b9b0);
            color: var(--text);
            padding: 24px 28px;
            margin-bottom: 24px;
            border-radius: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 2rem;
        }

        .header p {
            color: var(--muted);
            margin: 5px 0;
        }

        .members-container {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        @media (max-width: 1300px) {
            .members-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {
            .members-container {
                grid-template-columns: 1fr;
            }
        }

        .member-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .member-card h2 {
            margin: 0 0 10px;
            font-size: 1.1rem;
        }

        .member-card p {
            margin: 8px 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .member-card button {
            width: 100%;
            border: 1px solid var(--primary);
            border-radius: 10px;
            padding: 12px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s ease;
        }

        .member-card button:hover {
            background: var(--primary-dark);
        }

        .member-card button.disabled {
            background: #9ca3af;
            cursor: default;
        }

        #panel {
            margin-top: 20px;
            text-align: center;
        }
        #panel a, #panel a:visited {
            color: var(--text);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Group Evaluation</h1>
            <p id="group-info"><strong>Loading group members...</strong></p>
        </div>

        <div class="members-container" id="members-container">

        </div>

        <div id="panel">

            <a href="studentDashboard?studentId=">
                ← Back to dashboard
            </a>
                
        </div>

    </div>

    <script src="./js/student_GroupInfo.js"></script>
</body>
</html>
