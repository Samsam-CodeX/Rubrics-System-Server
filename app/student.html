<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Rating Info</title>

    <style>
        :root {
            --bg: #f7ece8;
            --surface: #fffaf8;
            --surface-soft: #f3e0da;
            --text: #4f2d28;
            --muted: #7a4f45;
            --primary: #a44d3d;
            --primary-dark: #8c3f33;
            --accent: #f0d7d0;
            --border: #d3a79a;
            --shadow: 0 6px 16px rgba(110, 66, 58, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            padding: 24px;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
        }

        .student-header {
            background: linear-gradient(135deg, var(--accent), #e5b9b0);
            color: var(--text);
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .ratings-wrapper {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: auto;
            max-height: 500px;
            background: var(--surface-soft);
        }

        .ratings-table {
            width: max-content;
            min-width: 100%;
        }

        .rating-row {
            display: grid;
            grid-template-columns: 220px repeat(11, 140px);
        }

        .rating-row>div {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            background: white;
        }

        .rating-row>div:first-child {
            text-align: left;
            font-weight: 600;
        }

        .rating-header {
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .rating-header>div {
            background: var(--accent);
            font-weight: 700;
            border-bottom: 2px solid #cbd5e1;
        }

        .not-rated-card {
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        #panel {
            width: 100%;
            display: flex;
            justify-content: space-evenly;
        }
        #panel a, #panel a:visited {
            color: var(--text);
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="student-header">
        <h1 id="student-name">Loading student...</h1>
        <p id="student-average">Average Rating: —</p>
        <p id="student-raters">Total Raters: —</p>
    </div>

    <div class="section">

        <h2>Rated By</h2>

        <div class="ratings-wrapper">

            <div class="ratings-table">

                <div id="rating-header" class="rating-row rating-header">
                    <div>Rater</div>
                    <div>Content Accuracy</div>
                    <div>Understanding</div>
                    <div>Organization</div>
                    <div>Delivery</div>
                    <div>Audience</div>
                    <div>Visuals</div>
                    <div>Professional Appearance</div>
                    <div>Teamwork</div>
                    <div>Time</div>
                    <div>Strategy</div>
                    <div><strong>Total</strong></div>
                </div>

                <div id="ratings-container">
                    <!-- JavaScript inserts rating rows here -->
                </div>

            </div>

        </div>

    </div>

    <div class="section">

        <h2>Did not rate</h2>

        <div id="not-rated-container">

            <p>Checking for students...</p>

        </div>

    </div>

    <div id="panel">
        
        <a href="dashboard" class="back">
            Back to dashboard
        </a>

        <a href="groupInfo?group=" class="back">
            See group
        </a>        
    </div>

    <script src="./js/student.js"></script>

</body>

</html>
