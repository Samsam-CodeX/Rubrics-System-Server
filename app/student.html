<!DOCTYPE html>
<html>

<head>
    <title>Student Rating Info</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .student-header {
            border: 1px solid black;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section {
            border: 1px solid black;
            padding: 20px;
            margin-bottom: 20px;
        }

        .rating-row {
            display: grid;
            grid-template-columns: 150px repeat(5, 1fr);
            border: 1px solid black;
            padding: 10px;
            margin-bottom: 10px;
        }

        .not-rated-card {
            border: 1px solid black;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="student-header">
        <h1 id="student-name">Loading student...</h1>
        <p id="student-average">Average Rating: —</p>
        <p id="student-raters">Total Raters: —</p>
    </div>

    <div class="section">
        <h2>Rated By</h2>

        <div class="rating-row header-row">
            <div>Rater</div>
            <div>Clarity</div>
            <div>Delivery</div>
            <div>Teamwork</div>
            <div>Visuals</div>
            <div>Total</div>
        </div>

        <div id="ratings-container"></div>
    </div>

    <div class="section">
        <h2>Not Rated Yet</h2>

        <div id="not-rated-container"></div>
    </div>

    <script src="./js/student.js"></script>
</body>

</html>
