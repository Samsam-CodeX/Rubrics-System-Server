<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instructor Access</title>

    <style>
        :root {
            --bg: #f7ece8;
            --surface: #fffaf8;
            --surface-soft: #f3e0da;
            --text: #4f2d28;
            --muted: #7a4f45;
            --primary: #a44d3d;
            --primary-dark: #8c3f33;
            --accent: #f0d7d0;
            --border: #d3a79a;
            --shadow: 0 12px 30px rgba(110, 66, 58, 0.14);
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg, var(--bg) 0%, #fcf7f4 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .card{
            width:100%;
            max-width:420px;
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:18px;
            padding:35px;
            box-shadow:var(--shadow);
        }

        h1{
            margin-bottom:10px;
            text-align:center;
            color:var(--text);
        }

        p{
            text-align:center;
            color:#7a4f45;
            margin-bottom:30px;
            line-height:1.5;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#7a4f45;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid var(--border);
            border-radius:8px;
            margin-bottom:20px;
            font-size:15px;
            background:var(--surface);
        }

        input:focus{
            outline:none;
            border-color:var(--primary);
            box-shadow:0 0 0 3px rgba(165, 91, 76, 0.14);
        }

        button{
            width:100%;
            padding:13px;
            border:1px solid var(--primary);
            border-radius:8px;
            background:var(--primary);
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        #message{
            color:#9b2c2c; 
            min-height:20px
        }

        button:hover{
            background:var(--primary-dark);
        }

        .back{
            display:block;
            text-align:center;
            margin-top:20px;
            text-decoration:none;
            color:var(--primary);
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>Instructor Access</h1>

        <p>
            Enter the instructor access code to continue to the dashboard.
        </p>

        <form id="adminForm">

            <label for="code">
                Access Code
            </label>

            <input
                id="code"
                name="code"
                type="password"
                placeholder="Enter access code"
                required
                autofocus
            >

            <div id="message"></div>

            <button type="submit">
                Continue
            </button>

        </form>

        <a href="login" class="back">
            ← Back to Home
        </a>
    </div>

    <script src="./js/login_admin.js"></script>
</body>

</html>
